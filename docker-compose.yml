services:
  skill-manager:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HOST_OS=${HOST_OS:-linux}
    image: skill-manager:0.2.0
    container_name: skill-manager
    restart: unless-stopped
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTHONUNBUFFERED=1
      - HOST_OS=${HOST_OS:-}
    volumes:
      # Mount current host workspace directory to /app
      - .:/app
      # Cross-platform host skills mount (Windows: %USERPROFILE%, macOS/Linux: $HOME)
      - ${HOST_GEMINI_SKILLS_DIR:-${HOST_HOME:-${USERPROFILE:-$HOME}}/.gemini/antigravity/skills}:/home/appuser/.gemini/antigravity/skills
      - ${HOST_CLAUDE_SKILLS_DIR:-${HOST_HOME:-${USERPROFILE:-$HOME}}/.claude/skills}:/home/appuser/.claude/skills
      - ${HOST_CODEX_SKILLS_DIR:-${HOST_HOME:-${USERPROFILE:-$HOME}}/.codex/skills}:/home/appuser/.codex/skills
      - ${HOST_CURSOR_SKILLS_DIR:-${HOST_HOME:-${USERPROFILE:-$HOME}}/.cursor/skills}:/home/appuser/.cursor/skills
    networks:
      - skill-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 32M
    # Run periodic healthcheck & scan loop to keep service alive as a managed daemon
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        skill-manager healthcheck --format json &&
        skill-manager scan --format json &&
        while true; do sleep 60; skill-manager healthcheck --format json > /dev/null; done
    healthcheck:
      test: ["CMD", "skill-manager", "healthcheck", "--format", "json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  skill-net:
    driver: bridge

