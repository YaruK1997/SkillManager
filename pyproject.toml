[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-manager"
version = "0.2.0"
description = "Cross-platform Local AI Skills & Plugins Manager"
readme = "README.md"
requires-python = ">=3.15"
license = { text = "MIT" }
authors = [
    { name = "YaruK", email = "jack.kao.1997@gmail.com" }
]
dependencies = [
    "typer>=0.27.0",
    "rich>=15.0.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "gitpython>=3.1.40",
    "huggingface-hub>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "respx>=0.23.0",
]

[project.scripts]
skill-manager = "skill_manager.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
markers = [
    "r1: Round 1 functional correctness and normal AC tests (T-R1-*)",
    "r2: Round 2 boundary, abnormal AC, edge case, and fault injection tests (T-R2-*)",
    "r3: Round 3 regression and end-to-end acceptance workflow tests (T-R3-*)",
]

